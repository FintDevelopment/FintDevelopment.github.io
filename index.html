<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintalaria</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #4975e9;
    }

    .header {
      background-color: white;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .main {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 40px); /* 40px is the total header height (20px padding on top and bottom) */
    }

    .contact-button {
      background-color: red;
      color: black;
      padding: 10px 20px;
      font-size: 16px;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Fintalaria</h1>
  </div>

  <div class="main">
    <a href="mailto:fintalaria@gmail.com" class="contact-button">Contact</a>
  </div>

</body>
</html>
